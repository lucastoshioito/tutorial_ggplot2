project:
  type: website
  output-dir: _site

website:
  title: "Graphics with ggplot2"
  site-url: "https://lucastoshioito.github.io/tutorial_ggplot2/"
  description: "A practical introduction to ggplot2 and a growing collection of reusable figures."
  repo-url: "https://github.com/lucastoshioito/tutorial_ggplot2"
  favicon: favicon.svg
  search: true
  repo-actions: [source, issue]
  navbar:
    left:
      - href: index.qmd
        text: Tutorial
    right:
      - icon: github
        href: "https://github.com/lucastoshioito/tutorial_ggplot2"
        aria-label: GitHub repository
  page-footer:
    left: "Lucas Toshio Ito"
    right: "Built with Quarto"

format:
  html:
    theme:
      light: flatly
      dark: darkly
    toc: true
    toc-location: left
    toc-title: Contents
    number-sections: false
    highlight-style: github
    code-copy: true
    code-overflow: wrap
    code-fold: true
    code-tools: true
    code-link: true
    df-print: kable

execute:
  freeze: auto
  warning: false
  message: false
